config-version: 4

## General settings.
season:
  # The number of lives players start off with as well as the maximum amount.
  lives: 3
  # The size of the world border. Set to -1 to disable.
  border-size: 700
  # Whether the plugin should reveal everyone's soulmate upon randomization.
  reveal-soulmates: false
  # Whether eliminated players should be banned from the server.
  ban-spectators: false
  # Whether a title should be displayed when a player is eliminated and (harmless) lightning should strike at the player's last location.
  announce-eliminations: true


## Settings regarding the enchanting table.
enchanting-table:
  # Whether the enchanting table is craftable.
  craftable: false
  # Whether the enchanting table is breakable.
  breakable: true
  # Whether the enchanting table should be made immune to damage when dropped as an item.
  # Also prevents it from despawning.
  indestructible-on-drop: true


# Apply a max enchantment level to items from chest loot, villager trades, enchantment tables and anvils.
# Has no effect on already acquired items or existing villagers.
# Set to -1 to disable.
nerf-enchantments:
  max-level: 1
  enchants:
    - PROTECTION_ENVIRONMENTAL


disabled-enchantments:
  - LOOT_BONUS_BLOCKS
  - LOOT_BONUS_MOBS


## Add custom recipes here. See the examples for reference.
## Valid item names are specified on this web page under 'Enum Constants': https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html#enum-constant-summary
## If the recipe requires empty slots; use 'AIR' as the item name.
custom-recipes:
  # This first entry is for the classic Paper TNT recipe.
  # The key 'TNT' is the output item.
  # Shapeless is 'false' in this case, meaning the materials must be laid out in a specific way in the crafting grid.
  # The required materials are specified under 'grid' as if it were the 3x3 crafting grid.
  # The number of spaces doesn't matter, as long as each material is separated by a pipe ('|') symbol.
  TNT:
    shapeless: false
    grid:
      - PAPER | SAND      | PAPER
      - SAND  | GUNPOWDER | SAND
      - PAPER | SAND      | PAPER
  # This second entry is for the name tag recipe.
  # The key 'NAME_TAG' is the output item.
  # Shapeless is 'true' in this case, meaning it doesn't matter how the materials are laid out in the crafting grid.
  # The required materials are specified under 'materials' as a simple list.
  NAME_TAG:
    shapeless: true
    materials:
      - STRING
      - PAPER


## Specify any item to blacklist here.
## They won't be craftable, tradeable or generated in chest loot.
## Valid entries are specified on this web page under 'Enum Constants': https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html#enum-constant-summary
item-blacklist:
  enabled: true
  items:
    - LEATHER_HELMET
    - CHAINMAIL_HELMET
    - COPPER_HELMET
    - GOLDEN_HELMET
    - IRON_HELMET
    - DIAMOND_HELMET
    - NETHERITE_HELMET
    - TURTLE_HELMET
    - ENCHANTED_GOLDEN_APPLE
    - BOOKSHELF


## Specify any potion effect to blacklist here.
## They won't be brewable, craftable (tipped arrows), tradeable or generated in chest loot.
## Valid entries are specified on this web page under 'Enum Constants': https://hub.spigotmc.org/javadocs/spigot/org/bukkit/potion/PotionType.html#enum-constant-summary
potion-blacklist:
  enabled: true
  effects:
    - HARMING
    - STRONG_HARMING
    - STRENGTH
    - LONG_STRENGTH
    - STRONG_STRENGTH